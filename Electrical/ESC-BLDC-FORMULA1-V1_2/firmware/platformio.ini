; Bring-up firmware for the ESC HAT (NUCLEO-G474RE + DRV8353RS) with SimpleFOC.
; Each environment is one bring-up step. In VS Code: PlatformIO sidebar -> pick the environment ->
; "Upload and Monitor". Do them in order; only go to the next step when the previous one looks right.

[platformio]
default_envs = 1_drv_check

[env]
platform = ststm32
board = nucleo_g474re
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
lib_deps = askuric/Simple FOC@^2.3.4
lib_archive = false            ; required by SimpleFOC on STM32

[env:1_drv_check]
build_flags = -D STAGE=1

[env:2_hall_test]
build_flags = -D STAGE=2

[env:3_open_loop]
build_flags = -D STAGE=3

[env:4_closed_loop]
build_flags = -D STAGE=4

[env:5_foc_current]
build_flags = -D STAGE=5
