; Bring-up firmware for the ESC HAT (NUCLEO-G474RE + DRV8353RS) with SimpleFOC.
; Each environment is one bring-up step. In VS Code: PlatformIO sidebar -> pick the environment ->
; "Upload and Monitor". Do them in order; only go to the next step when the previous one looks right.

[platformio]
default_envs = 1_drv_check
; build files outside the project: the full project path + SimpleFOC's nested includes exceed
; the 260-character path limit of Windows otherwise
workspace_dir = ${platformio.core_dir}/ws/esc-hat

[env]
platform = ststm32@19.7.1        ; STM32 Arduino core 2.12 - SimpleFOC 2.4.0 does not build on core 3.0 yet
board = nucleo_g474re
framework = arduino
upload_protocol = stlink
monitor_speed = 115200
monitor_echo = yes             ; show what you type
monitor_eol = LF                ; SimpleFOC's Commander ends a command at a line feed
monitor_filters = send_on_enter ; type a whole command, it is sent when you press Enter
lib_deps =
    askuric/Simple FOC@2.4.0
    simplefoc/SimpleFOCDrivers@1.0.9   ; SmoothingSensor: interpolates the 60-degree hall steps
lib_archive = false            ; required by SimpleFOC on STM32
; 512-byte serial TX buffer: with the default 64 bytes a ~110-character status line blocks the loop for
; several ms, the FOC angle goes stale and the motor gives a "clack" once per second
build_flags = -D SERIAL_TX_BUFFER_SIZE=512

[env:1_drv_check]
build_flags = ${env.build_flags} -D STAGE=1

[env:2_hall_test]
build_flags = ${env.build_flags} -D STAGE=2

[env:3_open_loop]
build_flags = ${env.build_flags} -D STAGE=3

[env:4_closed_loop]
build_flags = ${env.build_flags} -D STAGE=4

[env:5_foc_current]
build_flags = ${env.build_flags} -D STAGE=5

; step 5 on the 12S Li-ion pack: over-voltage stop 55.4 V, current derated 38.4 -> 36.0 V (3.2 -> 3.0 V/cell)
[env:5_foc_battery]
build_flags = ${env.build_flags} -D STAGE=5 -D BATTERY_CELLS=12
